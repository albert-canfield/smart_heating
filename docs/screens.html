<!doctype html>
<!-- README screenshots from the real card with a mock house: #trio, #rooms, #cal. Rendered by docs/render.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Heating screenshots</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #121722; }
  body { font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .light {
    --card-background-color: #ffffff; --ha-card-background: #ffffff; --primary-text-color: #1c2024; --secondary-text-color: #6b7280;
    --primary-color: #03a9f4; --divider-color: rgba(0, 0, 0, .12); --warning-color: #e08a00; --error-color: #db4437;
    --disabled-text-color: #9aa0a6; --ha-card-border-radius: 16px;
    background: linear-gradient(180deg, #f4f6fa 0%, #eceff5 100%);
  }
  .dark {
    --card-background-color: #1d1f24; --ha-card-background: #1d1f24; --primary-text-color: #e6e8eb; --secondary-text-color: #9aa0a8;
    --primary-color: #4aa8ff; --divider-color: rgba(230, 232, 235, .12); --warning-color: #f5a524; --error-color: #ef5350;
    --disabled-text-color: #6b7078; --ha-card-border-radius: 16px;
    background: #121722;
  }
  h3 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .light h3 { color: #5b6472; } .dark h3 { color: #8a94a6; }
  .screen { display: none; min-height: 100vh; padding: 40px 0 48px; }
  .trio { grid-template-columns: repeat(3, 1fr); gap: 26px; padding: 34px 40px 40px; align-items: start; }
  .trio smart-heating-card { display: block; zoom: .8; }
  .one { width: 400px; margin: 0 auto; }
  #rooms .one { width: 430px; }
  .one smart-heating-card { display: block; zoom: .78; }
</style>
</head>
<body>
  <div class="screen trio light" id="trio">
    <div><h3>Learning your home</h3><smart-heating-card id="t1"></smart-heating-card></div>
    <div><h3>Heating, hot water, night</h3><smart-heating-card id="t2"></smart-heating-card></div>
    <div><h3>Off, frost protection on</h3><smart-heating-card id="t3"></smart-heating-card></div>
  </div>
  <div class="screen dark" id="rooms"><div class="one"><h3>Every room, explained</h3><smart-heating-card id="r1"></smart-heating-card></div></div>
  <div class="screen light" id="cal"><div class="one"><h3>Learning you can follow</h3><smart-heating-card id="c1"></smart-heating-card></div></div>

<script src="../custom_components/smart_heating/frontend/smart-heating-card.js"></script>
<script>
  const ROOMS = [
    // id, name, floor, temp, verdict, in use, extras
    ["bath", "Bathroom", 2, 18.9, "idle"], ["bed2", "Bedroom 2", 2, 18.8, "idle"], ["bed3", "Bedroom 3", 2, 19.4, "idle"],
    ["ensuite", "Ensuite", 2, 18.2, "idle"], ["land2", "Landing", 2, 20.3, "idle", false, { trv: false }],
    ["master", "Master bedroom", 2, 19.1, "idle", false, { trv: false }],
    ["kitchen", "Kitchen", 1, 18.8, "piggyback", true, { heater: true, reason: "topping up while boiler runs", grade: ["B", "very good", 84] }],
    ["land1", "Landing", 1, 19.6, "idle", false, { trv: false }], ["living", "Living room", 1, 18.2, "approved", true],
    ["wc", "Downstairs WC", 0, 18.4, "idle", false, { trv: false }], ["hall", "Hall", 0, 18.0, "idle", false, { trv: false }],
    ["office", "Office", 0, 17.6, "idle"], ["play", "Play room", 0, 17.9, "approved", true],
  ];

  function house(o) {
    const hass = { states: {}, entities: {}, devices: {}, callService: async () => {} };
    const add = (dev, id, state, attributes = {}) => {
      hass.states[id] = { entity_id: id, state: String(state), attributes };
      hass.entities[id] = { platform: "smart_heating", device_id: dev };
    };
    hass.devices.house = { name: "Smart Heating" };
    add("house", "sensor.sh_status", o.status, { reason: "", boiler_demand: o.demand ?? o.status === "heating",
      boiler_firing: o.firing ?? o.status === "heating", has_boiler: true, hot_water: !!o.hw, night: !!o.night, away: false,
      open_rooms: [], heater_rooms: o.status === "heating" ? ["Kitchen"] : [], monitor_only: !!o.monitor, boiler_called: o.status === "heating",
      radiator_rooms: o.status === "heating" ? ["Living room", "Play room"] : [], wanted_rooms: o.status === "heating" ? ["Living room", "Play room", "Kitchen"] : [],
      heating_rooms: o.status === "heating" ? ["Living room", "Play room", "Kitchen"] : [] });
    add("house", "sensor.sh_house_temperature", o.temp, { kind: "house_temperature" });
    add("house", "sensor.sh_outdoor", "8.6", { kind: "outdoor_day_mean", now: 7.9 });
    [[0, 17.9], [1, 18.9], [2, 19.1]].forEach(([f, t]) => add("house", `sensor.sh_floor_${f}`, t, { kind: "floor_temperature", floor: f }));
    add("house", "select.sh_mode", o.mode || "auto", { options: ["off", "one_cycle", "auto"] });
    add("house", "switch.sh_monitor_only", o.monitor ? "on" : "off", {});
    add("house", "number.sh_house_target", "19.0", { kind: "house_target", baseline_day: 17, baseline_night: 15, safety: 12 });
    add("house", "sensor.sh_calibration", o.cal?.pct ?? 100, { kind: "calibration", calibrated: !o.cal, available: true,
      learning_now: "collecting cooling data", can_heat_test: true, competing_automations: [], ...(o.cal?.attrs || {}) });
    add("house", "sensor.sh_window_advice", "none", { kind: "window_advice" });
    add("house", "sensor.sh_house_retention", "71", { kind: "heat_retention", scope: "house", grade: "B" });
    add("house", "sensor.sh_gas_today", "16.8", { kind: "gas_today", heating_hours: 3.4 });
    add("house", "sensor.sh_gas_cost_today", "1.31", { kind: "gas_cost_today" });
    add("house", "sensor.sh_heating_hours_today", "3.4", { kind: "heating_hours_today" });
    add("house", "sensor.sh_electric_today", "1.4", { kind: "electric_today", heater_hours: 0.8 });
    add("house", "sensor.sh_electric_cost_today", "0.36", { kind: "electric_cost_today" });
    for (const [id, name, floor, temp, verdict, occupied, x = {}] of ROOMS) {
      const v = o.status === "heating" ? verdict : "idle";
      hass.devices[id] = { name };
      add(id, `sensor.${id}_need`, v === "approved" ? "comfort" : "none", { floor, priority: "a", temperature: temp,
        target: o.mode === "off" ? 12 : occupied ? 19 : 17, target_source: o.mode === "off" ? "safety" : occupied ? "comfort" : "baseline",
        comfort: 19, trend: occupied ? 0.6 : -0.1, occupied: !!occupied, has_trv: x.trv !== false, has_heater: !!x.heater,
        heater_on: !!x.heater && o.status === "heating", deficit: occupied ? +(19 - temp).toFixed(1) : 0,
        heating_now: o.status === "heating" && (verdict === "approved" || verdict === "piggyback"),
        temperature_entity: `sensor.${id}_t`, temperature_source: "sensor" });
      add(id, `sensor.${id}_decision`, v, { valve_command: v === "approved", reason: x.reason || (occupied ? "heating: occupied" : "at baseline") });
      add(id, `select.${id}_override`, "auto", {});
      add(id, `number.${id}_target`, "19.0", { kind: "room_target", vs_house: 0 });
      if (x.heater) add(id, `sensor.${id}_energy`, "1.42", { kind: "room_energy", power_now_w: 1800, cost_today: 0.36 });
      const [g, rating, tau] = x.grade || ["C", "good", 61];
      add(id, `sensor.${id}_tau`, tau, { kind: "heat_loss_tau", free_heat_gain: 5.2, calibration: 100 });
      add(id, `sensor.${id}_warm`, "1.3", { kind: "warm_up_rate" });
      add(id, `sensor.${id}_pred`, "18.5", { kind: "predicted_2h", predicted_8h: 17.9, hours_to_baseline: 11.5, baseline: 17 });
      add(id, `sensor.${id}_ret`, "70", { kind: "heat_retention", grade: g, rating, settled: true, grade_range: g });
      hass.states[`sensor.${id}_t`] = { entity_id: `sensor.${id}_t`, state: String(temp), attributes: { friendly_name: `${name} thermometer` } };
    }
    return hass;
  }

  function show(id, hass, config = {}, state = {}) {
    const card = document.getElementById(id);
    card.setConfig(config);
    Object.assign(card, state);
    card.hass = hass;
  }

  const which = (location.hash || "#trio").slice(1);
  const el = document.getElementById(which);
  el.style.display = which === "trio" ? "grid" : "block";
  document.documentElement.style.background = getComputedStyle(el).backgroundImage !== "none" ? "#eef1f6" : "#121722";
  const calAttrs = { rooms_done: 7, rooms_needed: 11, eta_hours: 30, cooling_hours: 24, cooling_hours_needed: 24,
    heat_test_cap: 21.5, heat_test_rise: 1, heat_test_max_min: 135, cooling_after_min: 60, night_cooling_hours: 8,
    variety_c: 2, variety_needed_c: 2, heating_hours: 1.2, heating_hours_needed: 2, heating_hours_left: 0.8,
    cooling_days: 4, cooling_days_needed: 4, uncertainty_pct: 38, uncertainty_needed_pct: 25 };
  if (which === "trio") {
    show("t1", house({ status: "heating", temp: "17.6", cal: { pct: 64, attrs: calAttrs } }));
    show("t2", house({ status: "heating", temp: "20.4", hw: true, night: true }), { title: "Heating" });
    show("t3", house({ status: "off", temp: "18.9", mode: "off", firing: false, demand: false }));
  } else if (which === "rooms") {
    show("r1", house({ status: "heating", temp: "19.4" }), {}, { _expanded: true, _open: "Kitchen", _aboutOpen: new Set(["Kitchen"]) });
  } else {
    show("c1", house({ status: "heating", temp: "18.1", cal: { pct: 64, attrs: calAttrs } }), {}, { _calOpen: true });
  }
</script>
</body>
</html>
