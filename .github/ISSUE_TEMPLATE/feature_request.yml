name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The problem it solves and how you'd use it.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Heating type, boiler control, TRVs or heaters, sensors.
