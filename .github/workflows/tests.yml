name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Decision core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest -q tests/test_core.py

  card:
    name: Card syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/smart_heating/frontend/smart-heating-card.js
