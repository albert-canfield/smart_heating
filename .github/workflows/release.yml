name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare manifest and const versions with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/smart_heating/manifest.json'))['version'])")
          CONST=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('custom_components/smart_heating/const.py').read()).group(1))")
          echo "tag=$TAG manifest=$MANIFEST const=$CONST"
          test "$TAG" = "$MANIFEST" && test "$TAG" = "$CONST"
